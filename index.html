<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1323">
  <title>Feliz cumpleaños, Isa</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/galaxia.css">
  <script src="js/scene.js" defer></script>
  <script src="js/galaxia.js" defer></script>
</head>
<body>
  <main class="scene" data-view="meadow">
    <button class="sound" id="sound" type="button" aria-label="Reproducir música" aria-pressed="false">
      <span class="sound__bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span id="sound-label">Activar música</span>
    </button>

    <section class="meadow" id="meadow" aria-label="Una pradera bajo el cielo estrellado">
      <canvas id="landscape" aria-hidden="true"></canvas>
      <div class="greeting" id="greeting" inert>
        <div class="greeting__star" aria-hidden="true">✦</div>
        <h1><span>Feliz cumpleaños</span> Isa</h1>
        <button class="invitation" id="begin" type="button">¿Empezamos? <span aria-hidden="true">✧</span></button>
      </div>
    </section>

    <section class="galaxy" id="galaxy" aria-labelledby="galaxy-title" hidden>
      <canvas id="galaxy-sky" aria-hidden="true"></canvas>
      <div class="galaxy__menu" id="galaxy-menu" inert>
        <button class="galaxy__back" id="back-to-meadow" type="button"><span aria-hidden="true">← </span>Volver</button>
        <header class="galaxy__header">
          <h2 id="galaxy-title" tabindex="-1">Elige un vinilo</h2>
          <p>Arrastra la órbita · Toca la estrella</p>
        </header>

        <ul class="galaxy-notes" aria-label="Mensajes para Isa">
          <li>Eres el orgullo de todos</li>
          <li>Tienes un bonito corazón</li>
          <li>Tu sonrisa ilumina mis días</li>
          <li>Confía en todo lo que puedes lograr</li>
          <li>El mundo es más bonito contigo</li>
        </ul>

        <div class="orbit" id="orbit" role="group" aria-label="Vinilos en órbita">
          <a class="record record--letter" href="escenas/carta.html">
            <span class="record__disc" aria-hidden="true"><span>✉</span></span>
            <span class="record__name">Carta</span>
          </a>
          <a class="record record--lights" href="escenas/luces.html">
            <span class="record__disc" aria-hidden="true"><span>✦</span></span>
            <span class="record__name">Luces</span>
          </a>
          <a class="record record--flowers" href="escenas/flores.html">
            <span class="record__disc" aria-hidden="true"><span>✿</span></span>
            <span class="record__name">Flores</span>
          </a>
          <a class="record record--candle" href="escenas/luz.html">
            <span class="record__disc" aria-hidden="true"><span>♢</span></span>
            <span class="record__name">Luz</span>
          </a>
          <a class="record record--dance" href="escenas/baile.html">
            <span class="record__disc" aria-hidden="true"><span>♫</span></span>
            <span class="record__name">Baile</span>
          </a>
        </div>

        <button class="galaxy-core" id="galaxy-core" type="button" aria-label="Leer el mensaje de la estrella"></button>
        <p class="core-message" id="core-message" role="status"></p>

        <div class="galaxy__controls">
          <button id="orbit-prev" type="button" aria-label="Girar los vinilos hacia la izquierda">‹</button>
          <button id="orbit-next" type="button" aria-label="Girar los vinilos hacia la derecha">›</button>
        </div>
      </div>
      <div class="galaxy__flash" id="galaxy-flash" aria-hidden="true"></div>

    </section>

    <audio id="music" src="assets/musica/Alpaquitay.mp3" preload="auto" autoplay></audio>
  </main>
</body>
</html>
