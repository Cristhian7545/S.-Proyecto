<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a8e0ef">
  <title>Flores · Te mereces todo lo bonito</title>
  <link rel="stylesheet" href="../css/flores.css">
  <script src="../js/flores.js" defer></script>
</head>
<body>
  <main class="grove" aria-label="Una chica sentada frente a ti bajo un cerezo, rodeada de flores que nacen en una loma">
    <div class="grove__cloud grove__cloud--near" aria-hidden="true"></div>
    <div class="grove__cloud grove__cloud--far" aria-hidden="true"></div>
    <div class="grove__tree" id="cherry-tree" aria-hidden="true">
      <img src="../assets/imagenes/cerezo.png" alt="" width="1254" height="1254">
    </div>
    <canvas id="flower-field" aria-hidden="true"></canvas>
    <header class="grove__controls">
      <a class="grove__control" href="../index.html#galaxia"><span aria-hidden="true">←</span> Volver a los vinilos</a>
      <button class="grove__control" id="flower-sound" type="button" aria-pressed="false">
        <span class="grove__note" aria-hidden="true">♫</span>
        <span id="flower-sound-label">Activar música</span>
      </button>
    </header>
    <h1 class="grove__wish">
      <span class="grove__ornament" aria-hidden="true">✿</span>
      <span>Te mereces</span>
      <em>todo lo bonito</em>
    </h1>
    <audio id="flower-music" src="../assets/musica/Labios Rotos.mp3" autoplay loop preload="auto"></audio>
  </main>
</body>
</html>
